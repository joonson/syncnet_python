[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncnet"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = [
    "torch>=1.4.0",
    "torchvision>=0.5.0",
    "numpy>=1.18.1",
    "scipy>=1.2.1",
    "scenedetect>=0.6.5.2",
    "opencv-contrib-python",
    "python_speech_features",
]

[tool.setuptools.packages.find]
where = ["src"]
